<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nightfall — share image</title>
<!-- Source for public/media/og.jpg (1200×630). Laid out like the start screen: copy on the
     left over the scrim, the forest and a foxfire stone on the right. Rebuild with
     node scripts/build-media.mjs -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=block">
<style>
:root{
  --ink:#07090c; --bone:#d9d3c4; --ash:#8b928c; --foxfire:#bfe9cf;
  --display:"IM Fell English SC",Georgia,serif;
  --serif:"IM Fell English",Georgia,serif;
  --mono:"Cutive Mono",Menlo,monospace;
}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--ink);color:var(--bone);-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0;width:1200px;height:630px;display:block}
#scrim{background:linear-gradient(90deg,rgba(7,9,12,.95) 0%,rgba(7,9,12,.84) 33%,rgba(7,9,12,.36) 58%,rgba(7,9,12,0) 80%)}
#vignette{background:radial-gradient(ellipse 80% 78% at 58% 50%,transparent 48%,rgba(0,0,0,.42) 80%,rgba(0,0,0,.82) 100%)}
.copy{position:absolute;left:88px;top:50%;transform:translateY(-50%);width:560px;display:grid;gap:22px}
.eyebrow{margin:0;font:17px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ash)}
h1{margin:0 0 0 -5px;font:400 156px/.86 var(--display);letter-spacing:.01em;text-shadow:0 2px 34px rgba(0,0,0,.65)}
.lede{margin:0;max-width:21em;font:27px/1.45 var(--serif)}
.lede em{color:var(--foxfire)}
.hud{margin-top:8px;display:flex;align-items:center;gap:16px;font:16px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.pips{display:flex;gap:12px}
.pips i{width:10px;height:10px;transform:rotate(45deg);border:1.5px solid rgba(191,233,207,.55)}
.pips i.on{background:var(--foxfire);box-shadow:0 0 12px 3px rgba(191,233,207,.5)}
.hud b{font-weight:400;color:var(--bone);letter-spacing:.08em}
</style>
</head>
<body>
<svg class="layer" viewBox="0 0 1200 630" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset=".45" stop-color="#0c121c"/>
      <stop offset=".72" stop-color="#18212e"/>
      <stop offset=".86" stop-color="#0f151e"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <radialGradient id="haze">
      <stop offset="0" stop-color="#a4b6de" stop-opacity=".3"/>
      <stop offset=".3" stop-color="#5d6f96" stop-opacity=".12"/>
      <stop offset="1" stop-color="#29303f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#b4f8d6" stop-opacity=".55"/>
      <stop offset=".22" stop-color="#86e6b4" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#86e6b4" stop-opacity=".06"/>
      <stop offset="1" stop-color="#86e6b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool">
      <stop offset="0" stop-color="#9ff5c8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#9ff5c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="mist" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
    <!-- Low-poly pine from world.js: bare trunk, four stacked cone tiers. Base at 0, 100 units tall. -->
    <path id="pine" d="M-2.2 0L-.9-97H.9L2.2 0Z
      M0-58.3L23.1-25Q0-19.5-23.1-25Z
      M0-73.2L19.4-43.5Q0-38.8-19.4-43.5Z
      M0-87L14.8-61.1Q0-57.4-14.8-61.1Z
      M0-100L9.3-77.8Q0-75.4-9.3-77.8Z"/>
    <!-- Dead tree: tapered trunk with a few bare, crooked limbs -->
    <path id="dead" fill="none" stroke-linecap="round" d="M0 0V-86
      M0-30L-18-52M0-44L16-64M0-55L-14-72M0-64L12-80M0-72L-8-86M-9-41L-14-40M9-55L14-56"/>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="1010" cy="118" r="330" fill="url(#haze)"/>
  <circle cx="1010" cy="118" r="27" fill="#dfe8fa" opacity=".5" filter="url(#soft)"/>
  <circle cx="1010" cy="118" r="20" fill="#eaf2ff" opacity=".88"/>
  <g id="stars" fill="#9aa6bc"></g>

  <g id="far" fill="#121a24"></g>
  <rect x="-60" y="428" width="1320" height="80" fill="#1a2331" opacity=".85" filter="url(#mist)"/>
  <g id="mid" fill="#0d1219"></g>
  <use href="#dead" transform="translate(1046 548) scale(2.6 2.9)" stroke="#0d1219" stroke-width="1.6"/>
  <rect x="-60" y="500" width="1320" height="70" fill="#141b26" opacity=".7" filter="url(#mist)"/>
  <rect y="566" width="1200" height="64" fill="#07090c"/>
  <rect x="-60" y="540" width="1320" height="50" fill="#0e141c" opacity=".9" filter="url(#mist)"/>

  <!-- Foxfire stone -->
  <circle cx="868" cy="410" r="290" fill="url(#glow)"/>
  <ellipse cx="868" cy="566" rx="230" ry="36" fill="url(#pool)"/>
  <g id="stone"></g>

  <g id="near" fill="#080b0f"></g>
  <g fill="#050709">
    <use href="#pine" transform="translate(1188 760) scale(6.6 7.4)"/>
    <use href="#pine" transform="translate(600 800) scale(6 7)"/>
  </g>
</svg>
<div class="layer" id="scrim"></div>
<div class="layer" id="vignette"></div>
<svg class="layer" viewBox="0 0 1200 630" aria-hidden="true"><rect width="1200" height="630" filter="url(#noise)" opacity=".05"/></svg>

<div class="copy">
  <p class="eyebrow">Hollow Pines State Forest · 2:14 a.m.</p>
  <h1>Nightfall</h1>
  <p class="lede">Somewhere in these woods, five <em>foxfire stones</em> still glow. Gather them. Keep your light on.</p>
  <div class="hud"><span>Foxfire</span><span class="pips"><i class="on"></i><i></i><i></i><i></i><i></i></span><b>1 / 5</b></div>
</div>

<script>
// Seeded (same generator as world.js) so the image is identical between builds
const rand = (a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20261031);
const rr = (a, b) => a + (b - a) * rand();
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

function forest(id, { n, x0, x1, base, jitter, s0, s1, skip }) {
  const g = document.getElementById(id);
  for (let i = 0; i < n; i++) {
    const x = x0 + (x1 - x0) * (i + rr(-0.35, 0.35)) / (n - 1), y = base + rr(-jitter, jitter), s = rr(s0, s1);
    if (skip && x > skip[0] && x < skip[1]) continue;
    g.append(el('use', { href: '#pine', transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(s * rr(0.85, 1.1)).toFixed(2)} ${s.toFixed(2)})` }));
  }
}
forest('far', { n: 36, x0: -20, x1: 1220, base: 470, jitter: 8, s0: 1.4, s1: 2.1 });
forest('mid', { n: 17, x0: -30, x1: 1230, base: 548, jitter: 10, s0: 2.5, s1: 3.3 });
forest('near', { n: 7, x0: 40, x1: 1260, base: 650, jitter: 12, s0: 4.4, s1: 5.4, skip: [700, 1020] });

const stars = document.getElementById('stars');
for (let i = 0; i < 70; i++) stars.append(el('circle', { cx: rr(0, 1200).toFixed(1), cy: rr(0, 300).toFixed(1), r: rr(0.6, 1.4).toFixed(2), opacity: rr(0.15, 0.5).toFixed(2) }));

// Octahedron seen slightly from above, like the in-game relic (relics.js)
function octa(cx, cy, r, yaw, tilt = 0.24) {
  const cyw = Math.cos(yaw), syw = Math.sin(yaw), ct = Math.cos(tilt), st = Math.sin(tilt);
  const p = (x, y, z) => { const X = x * cyw + z * syw, Z = -x * syw + z * cyw; return [cx + X * r, cy - (y * ct - Z * st) * r]; };
  return { T: p(0, 1, 0), B: p(0, -1, 0), E: [p(1, 0, 0), p(0, 0, 1), p(-1, 0, 0), p(0, 0, -1)] };
}
const pts = (...ps) => ps.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
{
  const g = document.getElementById('stone'), cx = 868, cy = 410;
  const core = octa(cx, cy, 44, 0.44), shell = octa(cx, cy, 76, -0.61);
  const [R, F, L] = core.E;   // right, front, left — the front vertex is where four lit facets meet
  g.append(el('polygon', { points: pts(core.T, R, core.B, L), fill: '#c8ffe6', opacity: 0.85, filter: 'url(#bloom)' }));
  const S = shell.E, wire = [...S.flatMap(v => [[shell.T, v], [shell.B, v]]), ...S.map((v, i) => [v, S[(i + 1) % 4]])];
  g.append(el('path', { d: wire.map(([a, b]) => `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`).join(''), fill: 'none', stroke: '#9ff5c8', 'stroke-width': 1.6, 'stroke-opacity': 0.5 }));
  [[core.T, L, F, '#f4fffa'], [core.T, F, R, '#cdfae4'], [L, core.B, F, '#a9f0cc'], [F, core.B, R, '#86deb2']]
    .forEach(([a, b, c, fill]) => g.append(el('polygon', { points: pts(a, b, c), fill })));
}
</script>
</body>
</html>
